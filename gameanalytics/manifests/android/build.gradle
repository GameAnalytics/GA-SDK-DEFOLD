repositories {
    // Only fetch the GameAnalytics SDK from its own repository, so the build
    // never asks another repository for it.
    exclusiveContent {
        forRepository {
            maven { url 'https://maven.gameanalytics.com/release' }
        }
        filter {
            includeGroup 'com.gameanalytics.sdk'
        }
    }
}

dependencies {
	// play-services-appset is left out for now: it pulls in Google and androidx
	// libraries the Defold build server fails to download. Without it the SDK
	// skips the App Set ID, and error reporting needs androidx.core from
	// another extension (see README).
	implementation('com.gameanalytics.sdk:gameanalytics-android:7.2.0') {
		exclude group: 'com.google.android.gms', module: 'play-services-appset'
	}
}
